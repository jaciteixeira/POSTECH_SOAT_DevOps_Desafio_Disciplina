name: pipeline

on:
  push:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v2

      - name: Package
        run: mvn package

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions: 
      contents: read
      packages: write
      
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with: 
          java-version: '11'
          distribution: 'adopt'
          package: '*.jar'
      - name: Publish
        run: mvn --batch-mode deploy -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/jaciteixeira/POSTECH_SOAT_DevOps_Desafio_Disciplina
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
  deploy-STG:
    runs-on: ubuntu-latest
  
    needs: publish
    environment:
  
      name: stg
  
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Deploy
        shell: bash
    
        run: |
          echo "Deploy STG"
